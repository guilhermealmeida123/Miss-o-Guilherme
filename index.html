<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Missao inteligencia Artificial </title>
</head>
<body>
    <div class="caixa-principal">
        <h1>Você está disposto para o futuro?</h1>
        <div class="caixa-perguntas">
            <p>Você já sabe o que você planeja para seu futuro??</p>
        </div>
        <div class="caixa-alternativas">
            <button>Sim, eu já sei</button>
            <button>Não, estou ajustando algumas coisas</button>
        </div>
        <div class="caixa-resultado">
            <p class="texto-resultado">E o seu texto final, já está pronto?</p>
        </div>
    </div>
</body>
</html>
